
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAProxy Config Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: "Inter", sans-serif;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
        }
        .section-card {
            margin-bottom: 20px;
            border-radius: 0.5rem; /* Tailwind rounded-lg */
        }
        .section-card .card-header {
            font-weight: bold;
            cursor: pointer; /* Indicate it's clickable */
            display: flex; /* Use flexbox for alignment */
            align-items: center; /* Vertically align items */
            padding: 10px 15px; /* Adjust padding */
        }
         .section-card .card-header i {
            margin-right: 10px; /* Space between icon and text */
            font-size: 1.2em; /* Increase icon size */
         }
        .section-card .card-body {
            padding: 15px;
        }
        .section-card .list-group-item {
            border: none;
            padding: 5px 0;
             display: flex; /* Use flexbox for icons within list items */
             align-items: center;
        }
         .section-card .list-group-item i {
             margin-right: 8px; /* Space between icon and text in list items */
             font-size: 0.9em; /* Adjust icon size in list items */
             color: #666; /* Slightly darker grey for list item icons */
         }

        .backend-list-item {
            margin-top: 10px;
            padding-top: 5px;
            border-top: 1px dashed #ccc;
        }
         .server-list-item {
            font-size: 0.9em;
            color: #555;
            padding-left: 15px; /* Indent server list items */
        }
        /* Removed: Style for the collapsible rules toggle within the card body */
        /* .collapsed-rules-toggle {
            cursor: pointer;
            text-decoration: underline;
            color: #007bff;
        }
        .collapsed-rules-toggle:hover {
            color: #0056b3;
        } */
         /* Style for the main collapsible card body */
        /* Removed: .card-body.collapse:not(.show) { display: none; } */

        /* Ensure content is visible and opaque when expanded */
         .card-body.collapse.show {
             opacity: 1 !important; /* Ensure full opacity */
             /* Removed the previous visibility rule here */
         }

         /* NEW RULE: Ensure visibility for the card-body when the collapse parent is shown */
         .collapse.show .card-body {
             visibility: visible !important;
         }


         .backend-details {
             margin-top: 15px;
             padding-top: 10px;
             border-top: 1px solid #eee;
         }
         .backend-details h6 {
             margin-bottom: 5px;
         }

         /* Header Colors based on Section Type */
         .card-header.frontend-header {
             background-color: #d4edda; /* Light green */
             color: #155724; /* Dark green text */
             border-bottom: 1px solid #c3e6cb;
         }
         .card-header.listen-header {
             background-color: #cce5ff; /* Light blue */
             color: #004085; /* Dark blue text */
             border-bottom: 1px solid #b8daff;
         }
          .card-header.backend-header {
             background-color: #fff3cd; /* Light yellow */
             color: #856404; /* Dark yellow text */
             border-bottom: 1px solid #ffeeba;
         }
          .card-header.unreferenced-backend-header {
             background-color: #f8d7da; /* Light red */
             color: #721c24; /* Dark red text */
             border-bottom: 1px solid #f5c6cb;
         }
          .card-header.global-header,
          .card-header.defaults-header {
             background-color: #e2e3e5; /* Grey */
             color: #383d41; /* Dark grey text */
             border-bottom: 1px solid #d6d8db;
         }
    </style>
</head>
<body>
    <div class="container mx-auto">
        <h1 class="text-2xl font-bold mb-4">HAProxy Configuration Viewer</h1>

        <div class="mb-4 p-4 bg-white rounded-lg shadow">
            <label for="haproxyFile" class="form-label">Upload your HAProxy configuration file (.cfg or .txt):</label>
            <input class="form-control" type="file" id="haproxyFile" accept=".cfg, .txt">
        </div>

        <div id="configOutput" class="mt-4">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

    <script>
        document.getElementById('haproxyFile').addEventListener('change', handleFileSelect, false);

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) {
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const configContent = e.target.result;
                const parsedData = parseHaproxyConfig(configContent);
                displayConfig(parsedData);
            };
            reader.readAsText(file);
        }

        function parseHaproxyConfig(configContent) {
            const sections = {};
            let currentSection = null;
            let currentSectionName = null;

            const lines = configContent.split('\n')
                .map(line => line.split('#')[0].trim()) // Remove comments and trim whitespace
                .filter(line => line); // Remove empty lines

            for (const line of lines) {
                const sectionMatch = line.match(/^(global|defaults|frontend|backend|listen)\s+(\S+)?/);
                if (sectionMatch) {
                    const sectionType = sectionMatch[1];
                    const sectionName = sectionMatch[2] || sectionType; // Use type if no name (e.g., global)
                    currentSection = sectionType;
                    currentSectionName = sectionName;
                    if (!sections[currentSection]) {
                        sections[currentSection] = {};
                    }
                    sections[currentSection][currentSectionName] = {
                        name: currentSectionName,
                        type: currentSection,
                        rules: [],
                        servers: [],
                        binds: [] // Added to store bind lines
                    };
                    continue;
                }

                if (currentSectionName && sections[currentSection] && sections[currentSection][currentSectionName]) {
                    const sectionData = sections[currentSection][currentSectionName];

                    // Parse bind lines for frontends/listens
                    const bindMatch = line.match(/^bind\s+(.*)/);
                     if (bindMatch && (currentSection === 'frontend' || currentSection === 'listen')) {
                         sectionData.binds.push({ line: line });
                         continue;
                     }

                    // Parse use_backend or default_backend rules
                    const backendRuleMatch = line.match(/^(default_backend|use_backend)\s+(\S+)/);
                    if (backendRuleMatch) {
                        sectionData.rules.push({
                            type: backendRuleMatch[1],
                            target: backendRuleMatch[2],
                            line: line // Store the full line for display
                        });
                        continue;
                    }

                    // Parse server lines
                    const serverMatch = line.match(/^server\s+(\S+)\s+(\S+)/);
                    if (serverMatch) {
                        sectionData.servers.push({
                            name: serverMatch[1],
                            address: serverMatch[2],
                            line: line // Store the full line for display
                        });
                        continue;
                    }

                    // Optionally, capture other lines if needed for context
                    // sectionData.rules.push({ type: 'other', line: line });
                }
            }
            return sections;
        }

        function displayConfig(parsedData) {
            const outputDiv = document.getElementById('configOutput');
            outputDiv.innerHTML = ''; // Clear previous output

            let cardIndex = 0; // To generate unique IDs for collapsible card bodies

            // Display Frontends and Listens, grouped with their backends
            const entryPoints = ['frontend', 'listen'];
            for (const sectionType of entryPoints) {
                if (parsedData[sectionType]) {
                     const sectionTypeTitle = sectionType.charAt(0).toUpperCase() + sectionType.slice(1) + 's';

                     const sectionContainer = document.createElement('div');
                     sectionContainer.classList.add('mb-4');
                     sectionContainer.innerHTML = `<h2 class="text-xl font-semibold mb-3">${sectionTypeTitle}</h2>`;

                     const row = document.createElement('div');
                     row.classList.add('row');

                    for (const sectionName in parsedData[sectionType]) {
                        const sectionData = parsedData[sectionType][sectionName];
                        const col = document.createElement('div');
                        col.classList.add('col-md-6', 'col-lg-4'); // Adjust column sizes for responsiveness

                        const card = document.createElement('div');
                        card.classList.add('card', 'section-card', 'shadow-sm');

                        const cardHeader = document.createElement('div');
                        cardHeader.classList.add('card-header', `${sectionType}-header`); // Add class for coloring
                        // Add icon based on type - SWAPPED ICONS AGAIN
                        let iconClass = '';
                        if (sectionType === 'frontend') {
                            iconClass = 'fas fa-globe'; // Globe icon for frontend
                        } else if (sectionType === 'listen') {
                             iconClass = 'fas fa-plug'; // Plug icon for listen
                        }
                        cardHeader.innerHTML = `<i class="${iconClass}"></i> ${sectionData.name}`; // Only display name

                        // Add Bootstrap collapse attributes to the header
                        const cardBodyId = `card-body-${sectionType}-${sectionName.replace(/[^a-zA-Z0-9]/g, '_')}-${cardIndex++}`; // Generate unique ID
                        cardHeader.setAttribute('data-bs-toggle', 'collapse');
                        cardHeader.setAttribute('data-bs-target', `#${cardBodyId}`);
                        cardHeader.setAttribute('aria-expanded', 'false');
                        cardHeader.setAttribute('aria-controls', cardBodyId);


                        const cardBodyCollapseDiv = document.createElement('div');
                        cardBodyCollapseDiv.classList.add('collapse'); // Make the entire card body collapsible
                        cardBodyCollapseDiv.id = cardBodyId; // Assign the unique ID

                        const cardBodyContent = document.createElement('div');
                        cardBodyContent.classList.add('card-body'); // Content inside the collapsible div

                         // Display bind lines with plug icon
                         if (sectionData.binds.length > 0) {
                             const bindsList = document.createElement('ul');
                             bindsList.classList.add('list-group', 'list-group-flush', 'mb-3');
                             const bindsTitle = document.createElement('h6');
                             bindsTitle.classList.add('card-subtitle', 'mb-2', 'text-muted');
                             bindsTitle.textContent = 'Binds:';
                             cardBodyContent.appendChild(bindsTitle);

                             sectionData.binds.forEach(bind => {
                                 const listItem = document.createElement('li');
                                 listItem.classList.add('list-group-item');
                                 listItem.innerHTML = `<i class="fas fa-plug"></i> ${bind.line}`; // Add plug icon
                                 bindsList.appendChild(listItem);
                             });
                             cardBodyContent.appendChild(bindsList);
                         }


                        // Display rules (use_backend, default_backend) with route icon
                        if (sectionData.rules.length > 0) {
                            const rulesTitle = document.createElement('h6');
                            rulesTitle.classList.add('card-subtitle', 'mb-2', 'text-muted');
                            rulesTitle.textContent = `Routing Rules (${sectionData.rules.length}):`; // No toggle text
                            cardBodyContent.appendChild(rulesTitle);

                            const rulesList = document.createElement('ul');
                            rulesList.classList.add('list-group', 'list-group-flush');

                            const backendsReferenced = new Set();

                            sectionData.rules.forEach(rule => {
                                const listItem = document.createElement('li');
                                listItem.classList.add('list-group-item');
                                listItem.innerHTML = `<i class="fas fa-route"></i> ${rule.line}`; // Add route icon
                                rulesList.appendChild(listItem);
                                if (rule.target) {
                                    backendsReferenced.add(rule.target);
                                }
                            });

                            cardBodyContent.appendChild(rulesList); // Append the rules list directly

                            // Display details for referenced backends
                            if (backendsReferenced.size > 0) {
                                const backendDetailsContainer = document.createElement('div');
                                backendDetailsContainer.classList.add('backend-details');
                                const backendDetailsTitle = document.createElement('h6');
                                backendDetailsTitle.classList.add('text-muted');
                                backendDetailsTitle.textContent = 'Referenced Backends:';
                                backendDetailsContainer.appendChild(backendDetailsTitle);

                                backendsReferenced.forEach(backendName => {
                                    if (parsedData['backend'] && parsedData['backend'][backendName]) {
                                        const backendData = parsedData['backend'][backendName];
                                        const backendDiv = document.createElement('div');
                                        backendDiv.innerHTML = `<strong><i class="fas fa-server"></i> ${backendName} Servers:</strong>`; // Add backend icon
                                        const serversList = document.createElement('ul');
                                        serversList.classList.add('list-group', 'list-group-flush');
                                        if (backendData.servers.length > 0) {
                                             backendData.servers.forEach(server => {
                                                const listItem = document.createElement('li');
                                                listItem.classList.add('list-group-item', 'server-list-item');
                                                listItem.textContent = server.line;
                                                serversList.appendChild(listItem);
                                            });
                                        } else {
                                             const listItem = document.createElement('li');
                                             listItem.classList.add('list-group-item', 'server-list-item');
                                             listItem.textContent = '(No servers defined)';
                                             serversList.appendChild(listItem);
                                        }
                                        backendDiv.appendChild(serversList);
                                        backendDetailsContainer.appendChild(backendDiv);
                                    } else {
                                         const backendDiv = document.createElement('div');
                                         backendDiv.innerHTML = `<strong><i class="fas fa-exclamation-triangle text-danger"></i> ${backendName}</strong>: <span class="text-danger">Backend not found or has no servers defined.</span>`; // Add warning icon
                                         backendDetailsContainer.appendChild(backendDiv);
                                    }
                                });
                                cardBodyContent.appendChild(backendDetailsContainer);
                            }

                        } else if (sectionData.servers.length > 0 && sectionType === 'listen') {
                             // If a listen has no use_backend rules but has servers (acting like a backend)
                             const serversList = document.createElement('ul');
                             serversList.classList.add('list-group', 'list-group-flush');
                             const serversTitle = document.createElement('h6');
                             serversTitle.classList.add('card-subtitle', 'mt-3', 'mb-2', 'text-muted');
                             serversTitle.textContent = 'Servers:';
                             cardBodyContent.appendChild(serversTitle);

                             sectionData.servers.forEach(server => {
                                 const listItem = document.createElement('li');
                                 listItem.classList.add('list-group-item', 'server-list-item');
                                 listItem.textContent = server.line; // Display the original line
                                 serversList.appendChild(listItem);
                             });
                             cardBodyContent.appendChild(serversList);
                        }


                        cardBodyCollapseDiv.appendChild(cardBodyContent); // Add content to the collapsible div
                        card.appendChild(cardHeader);
                        card.appendChild(cardBodyCollapseDiv); // Add the collapsible div to the card
                        col.appendChild(card);
                        row.appendChild(col);
                    }

                    sectionContainer.appendChild(row);
                    outputDiv.appendChild(sectionContainer);
                }
            }

             // Display Backends that were NOT referenced by any frontend/listen
             const allBackends = new Set(Object.keys(parsedData['backend'] || {}));
             const referencedBackends = new Set();
             for (const sectionType of entryPoints) {
                 if (parsedData[sectionType]) {
                     for (const sectionName in parsedData[sectionType]) {
                         const sectionData = parsedData[sectionType][sectionName];
                         sectionData.rules.forEach(rule => {
                             if (rule.target) {
                                 referencedBackends.add(rule.target);
                             }
                         });
                     }
                 }
             }

             const unreferencedBackends = [...allBackends].filter(backend => !referencedBackends.has(backend));

             if (unreferencedBackends.length > 0) {
                  const unreferencedSectionContainer = document.createElement('div');
                  unreferencedSectionContainer.classList.add('mb-4');
                  unreferencedSectionContainer.innerHTML = `<h2 class="text-xl font-semibold mb-3">Unreferenced Backends</h2>`;

                  const row = document.createElement('div');
                  row.classList.add('row');

                  unreferencedBackends.forEach(backendName => {
                      if (parsedData['backend'] && parsedData['backend'][backendName]) {
                           const backendData = parsedData['backend'][backendName];
                           const col = document.createElement('div');
                           col.classList.add('col-md-6', 'col-lg-4'); // Adjust column sizes for responsiveness

                           const card = document.createElement('div');
                           card.classList.add('card', 'section-card', 'shadow-sm');

                           const cardHeader = document.createElement('div');
                           cardHeader.classList.add('card-header', 'unreferenced-backend-header'); // Add class for coloring
                           cardHeader.innerHTML = `<i class="fas fa-unlink"></i> ${backendName}`; // Add unlink icon

                            // Add Bootstrap collapse attributes to the header
                           const cardBodyId = `card-body-backend-${backendName.replace(/[^a-zA-Z0-9]/g, '_')}-${cardIndex++}`; // Generate unique ID
                           cardHeader.setAttribute('data-bs-toggle', 'collapse');
                           cardHeader.setAttribute('data-bs-target', `#${cardBodyId}`);
                           cardHeader.setAttribute('aria-expanded', 'false');
                           cardHeader.setAttribute('aria-controls', cardBodyId);


                           const cardBodyCollapseDiv = document.createElement('div');
                           cardBodyCollapseDiv.classList.add('collapse'); // Make the entire card body collapsible
                           cardBodyCollapseDiv.id = cardBodyId; // Assign the unique ID

                           const cardBodyContent = document.createElement('div');
                           cardBodyContent.classList.add('card-body'); // Content inside the collapsible div

                           // Display servers for this backend
                           if (backendData.servers.length > 0) {
                               const serversList = document.createElement('ul');
                               serversList.classList.add('list-group', 'list-group-flush');
                               const serversTitle = document.createElement('h6');
                               serversTitle.classList.add('card-subtitle', 'mt-0', 'mb-2', 'text-muted');
                               serversTitle.textContent = 'Servers:';
                               cardBodyContent.appendChild(serversTitle);

                               backendData.servers.forEach(server => {
                                   const listItem = document.createElement('li');
                                   listItem.classList.add('list-group-item', 'server-list-item');
                                   listItem.textContent = server.line; // Display the original line
                                   serversList.appendChild(listItem);
                               });
                               cardBodyContent.appendChild(serversList);
                           } else {
                               const noServers = document.createElement('p');
                               noServers.classList.add('text-muted');
                               noServers.textContent = '(No servers defined for this backend)';
                               cardBodyContent.appendChild(noServers);
                           }


                           cardBodyCollapseDiv.appendChild(cardBodyContent); // Add content to the collapsible div
                           card.appendChild(cardHeader);
                           card.appendChild(cardBodyCollapseDiv); // Add the collapsible div to the card
                           col.appendChild(card);
                           row.appendChild(col);
                      }
                  });

                  unreferencedSectionContainer.appendChild(row);
                  outputDiv.appendChild(unreferencedSectionContainer);
             }


             // Display global and defaults sections
             const otherSections = ['global', 'defaults'];
             for (const sectionType of otherSections) {
                 if (parsedData[sectionType]) {
                     const sectionsOfType = parsedData[sectionType];
                      const sectionTypeTitle = sectionType.charAt(0).toUpperCase() + sectionType.slice(1);

                     const sectionContainer = document.createElement('div');
                     sectionContainer.classList.add('mb-4');
                     sectionContainer.innerHTML = `<h2 class="text-xl font-semibold mb-3">${sectionTypeTitle}</h2>`;

                     const row = document.createElement('div');
                     row.classList.add('row');

                     for (const sectionName in sectionsOfType) {
                         const sectionData = sectionsOfType[sectionName];
                         const col = document.createElement('div');
                         col.classList.add('col-md-6', 'col-lg-4'); // Adjust column sizes for responsiveness

                         const card = document.createElement('div');
                         card.classList.add('card', 'section-card', 'shadow-sm');

                         const cardHeader = document.createElement('div');
                         cardHeader.classList.add('card-header', `${sectionType}-header`); // Add class for coloring
                          // Add icon based on type
                         let iconClass = '';
                         if (sectionType === 'global') {
                             iconClass = 'fas fa-globe'; // Icon for global
                         } else if (sectionType === 'defaults') {
                              iconClass = 'fas fa-cog'; // Icon for defaults
                         }
                         cardHeader.innerHTML = `<i class="${iconClass}"></i> ${sectionType.toUpperCase()}`; // Only display type for global/defaults


                         // Add Bootstrap collapse attributes to the header
                         const cardBodyId = `card-body-${sectionType}-${sectionName.replace(/[^a-zA-Z0-9]/g, '_')}-${cardIndex++}`; // Generate unique ID
                         cardHeader.setAttribute('data-bs-toggle', 'collapse');
                         cardHeader.setAttribute('data-bs-target', `#${cardBodyId}`);
                         cardHeader.setAttribute('aria-expanded', 'false');
                         cardHeader.setAttribute('aria-controls', cardBodyId);


                         const cardBodyCollapseDiv = document.createElement('div');
                         cardBodyCollapseDiv.classList.add('collapse'); // Make the entire card body collapsible
                         cardBodyCollapseDiv.id = cardBodyId; // Assign the unique ID

                         const cardBodyContent = document.createElement('div');
                         cardBodyContent.classList.add('card-body'); // Content inside the collapsible div
                         cardBodyContent.textContent = `(Content of ${sectionType} section - parsing not fully implemented)`; // Placeholder

                         cardBodyCollapseDiv.appendChild(cardBodyContent); // Add content to the collapsible div
                         card.appendChild(cardHeader);
                         card.appendChild(cardBodyCollapseDiv); // Add the collapsible div to the card
                         col.appendChild(card);
                         row.appendChild(col);
                     }

                     sectionContainer.appendChild(row);
                     outputDiv.appendChild(sectionContainer);
                 }
             }
        }

        // Add a single event listener to the document for clicks on card headers
        document.addEventListener('click', function (event) {
            // Check if the clicked element or its parent is a card header
            const cardHeader = event.target.closest('.card-header');

            if (cardHeader) {
                const targetId = cardHeader.getAttribute('data-bs-target');
                const targetElement = document.querySelector(targetId);

                if (targetElement) {
                    // Find all currently open collapsible card bodies
                    // Use a more specific selector to target only the main card body collapses
                    const openCollapses = document.querySelectorAll('.section-card > .collapse.show');

                    // Collapse all other open main card body collapsible elements
                    openCollapses.forEach(openCollapse => {
                        // Ensure we don't try to collapse the element that was clicked
                        if (openCollapse !== targetElement) {
                            const collapseInstance = bootstrap.Collapse.getInstance(openCollapse);
                            if (collapseInstance) {
                                collapseInstance.hide();
                            } else {
                                // Fallback: if no instance exists, manually remove the 'show' class
                                openCollapse.classList.remove('show');
                                // Also update aria-expanded on the header
                                const header = document.querySelector(`[data-bs-target="#${openCollapse.id}"]`);
                                if(header) {
                                    header.setAttribute('aria-expanded', 'false');
                                }
                            }
                        }
                    });

                    // Toggle the clicked card body's collapse state
                    // We need to ensure Bootstrap's toggle is called *after* potentially hiding others
                    // Using a small timeout can help ensure this happens in the next event loop cycle
                    // Removed the timeout as it might be interfering with Bootstrap's transitions
                     const targetCollapseInstance = bootstrap.Collapse.getInstance(targetElement);
                     if (targetCollapseInstance) {
                         targetCollapseInstance.toggle();
                     } else {
                          // If no instance exists, create one and toggle
                          new bootstrap.Collapse(targetElement).toggle();
                     }
                }
            }
        });

    </script>
</body>
</html>
